{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dev Portfolio{% endblock %}</title>
    <meta name="description" content="Портфоліо розробника — проєкти, технології та досвід.">
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'projects' %}">dev.portfolio</a>

            <nav class="nav">
                <a class="nav-link" href="{% url 'blogs' %}">Блог</a>
                <a class="nav-link" href="{% url 'projects' %}">Проєкти</a>
                <a class="nav-link" href="{% url 'admin:index' %}">Адмін</a>
                <button class="theme-toggle" type="button" aria-label="Перемкнути тему">
                    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="container site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>&copy; {% now "Y" %} dev.portfolio</span>
            <span>Django</span>
        </div>
    </footer>

    <script>
        (function () {
            var root = document.documentElement;
            var toggle = document.querySelector('.theme-toggle');
            if (!toggle) return;
            toggle.addEventListener('click', function () {
                var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });
        })();
    </script>
</body>
</html>
